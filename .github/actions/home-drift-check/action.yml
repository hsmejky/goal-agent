# Home repo drift check (R59) as a goal-agent unit (ADR 0008). Called from a Home repo's
# .github/workflows/goal-agent-drift-check.yml at the shared goal-agent-pin. Runs scripts/home/drift-check.mjs
# from this action's own commit (github.action_path), which is the source the Home repo is compared with.
# Unlike the other actions it checks out the commit under check (the PR's or the pushed one), without
# credentials: it runs on pull_request, never pull_request_target, takes no secrets, and only reads those files
# (ADR 0008, amendment). GH_TOKEN is the calling job's GITHUB_TOKEN, used only to open the drift issue on a push.
name: Goal agent drift check
description: Fails when the Home repo's adopted text, guard copy, settings or callers differ from goal-agent at the pin.

runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Check for drift
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/../../../scripts/home/drift-check.mjs"
