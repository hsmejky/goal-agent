# Goal review gate (R37), as a composite action (ADR 0008). A Covered repo's caller workflow calls it as the one
# step of its gate job, at the full 40-hex goal-agent-pin, and names each installed Goal agent's
# GOAL_AGENT_<NAME>_FIRE_TOKEN and GOAL_AGENT_<NAME>_TRIGGER_ID in that step's env; the env reaches the script step.
# Same commit: the script runs from github.action_path, which GitHub downloads at the caller's uses: SHA. No step
# checks out or fetches the scripts' repository.
# Trust: checks out the caller repo's default branch without credentials and runs nothing from the PR.
name: Goal review gate
description: Sets the goal-agent-review status of each PR an event concerns, and fires the Goal agents whose review is missing.

runs:
  using: composite
  steps:
    # No ref: the default branch for every event, never the PR head.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Evaluate the gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/../../../scripts/gate/gate.mjs"
