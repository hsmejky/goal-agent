# Home repo staleness check (R51) as a goal-agent unit (ADR 0008). Called from a Home repo's
# .github/workflows/goal-agent-staleness.yml at the shared goal-agent-pin. Runs scripts/home/staleness.mjs
# from this action's own commit (github.action_path). It checks out the Home repo (default branch, no
# credentials) for the agent definition and takes no secrets: GH_TOKEN is the calling job's GITHUB_TOKEN.
name: Goal agent staleness
description: Unless the agent is Halted, opens one issue when its Last run comment is missing or too old.

runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Check Last run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/../../../scripts/home/staleness.mjs"
