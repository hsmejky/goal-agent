# Goal agent Consultation (R54), as a composite action (ADR 0008). A Covered repo's caller workflow calls it as the
# one step of its consult job, at the full 40-hex goal-agent-pin, and names each installed Goal agent's
# GOAL_AGENT_<NAME>_FIRE_TOKEN and GOAL_AGENT_<NAME>_TRIGGER_ID in that step's env; the env reaches the script step.
# Same commit: the script runs from github.action_path, which GitHub downloads at the caller's uses: SHA. No step
# checks out or fetches the scripts' repository.
# The comment body is untrusted: the script reads it from the event file, and it never reaches a shell.
name: Goal agent Consultation
description: Fires the Goal agent that a question comment on an issue names, with the comment URL.

runs:
  using: composite
  steps:
    # The default branch, never the PR head.
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Fire the agent
      shell: bash
      run: node "${{ github.action_path }}/../../../scripts/gate/consult.mjs"
