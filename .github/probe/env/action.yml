# TEMPORARY probe for #112: does the calling step's env reach the script step of a composite action?
# Same shape as .github/actions/gate: checkout, setup-node, then a script step with its own env.
name: Composite env probe
description: Reports whether the calling step's env reaches the action's script step.
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
    - name: Report the environment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: node "${{ github.action_path }}/probe.mjs"
