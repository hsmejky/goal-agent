# Home repo staleness check (R51). Install in a Home repo as .github/workflows/goal-agent-staleness.yml.
# Daily: unless the agent is Halted, opens one issue when its `Last run` comment is missing or older than max(6 h, 2 x cadence); cadence is read from the agent definition (missing: 6 hours).
name: Goal agent staleness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: goal-agent-staleness
  cancel-in-progress: false

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check Last run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/home/staleness.mjs
