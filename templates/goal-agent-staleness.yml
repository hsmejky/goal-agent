# Home repo staleness check (R51). Install in a Home repo as .github/workflows/goal-agent-staleness.yml.
# A thin caller (ADR 0008): the only step is the goal-agent action, which runs scripts/home/staleness.mjs
# from the commit named in `uses:`. Replace <goal-agent-pin> with the shared goal-agent-pin (full 40-hex
# commit SHA on goal-agent's main), the same in every `uses:` line of the repo.
# Daily: unless the agent is Halted, opens one issue when its `Last run` comment is missing or older
# than max(6 h, 2 x cadence); cadence is read from the agent definition (missing: 6 hours).
name: Goal agent staleness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: goal-agent-staleness
  cancel-in-progress: false

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: hsmejky/goal-agent/.github/actions/home-staleness@<goal-agent-pin>
