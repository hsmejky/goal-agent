# Home repo audit (R50). Install in a Home repo as .github/workflows/goal-agent-audit.yml. A thin caller
# (ADR 0008): the only step is the goal-agent action, which runs scripts/home/audit.mjs from the commit
# named in `uses:`. Replace the all-zero SHA with the shared goal-agent-pin (full 40-hex commit SHA on
# goal-agent's main), the same in every `uses:` line of the repo.
# On every push to main: a commit outside memory/ with no merged PR sets Halted and opens one issue.
name: Goal agent audit

on:
  push:
    branches: [main]

# Issues are the only write. Contents and pull requests are read for commit files and associated PRs.
permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: goal-agent-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: hsmejky/goal-agent/.github/actions/home-audit@0000000000000000000000000000000000000000
